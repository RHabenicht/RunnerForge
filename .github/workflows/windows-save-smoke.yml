name: Windows build and acceptance tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - run: go test -timeout 3m -v ./...
      - run: go vet ./...
      - run: go build -ldflags="-H windowsgui" -o RunnerForge.exe ./cmd/nsrcgii
      - name: Check native window startup
        shell: pwsh
        run: |
          $p = Start-Process ./RunnerForge.exe -PassThru
          try {
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.HasExited) { throw "Application exited before opening a window" }
              if ($p.MainWindowHandle -ne 0) { break }
            }
            if ($p.MainWindowHandle -eq 0 -or $p.MainWindowTitle -notmatch 'RunnerForge') {
              throw "RunnerForge main window did not open"
            }
            if (-not $p.CloseMainWindow() -or -not $p.WaitForExit(10000)) {
              throw "Application did not close normally"
            }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc ..\installer\RunnerForge.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compiler failed' }
      - name: Test install, launch and uninstall
        shell: pwsh
        run: ..\installer\test-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: RunnerForge-Windows-development
          path: |
            dist/RunnerForge-Setup-0.2.0.exe
            go/RunnerForge.exe
          if-no-files-found: error
